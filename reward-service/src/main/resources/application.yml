server:
  port: 8082

spring:
  application:
    name: reward-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/reward_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:213.199.42.57}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:students}
    password: ${RABBITMQ_PASSWORD:Ut3c2026}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
